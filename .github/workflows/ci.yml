# Continuous integration for every push and pull request.
#
# 1. checks:    lint (JS, CSS, PHP), library boundaries, types, unit tests,
#               PHPStan. Fast; no WordPress.
# 2. wordpress: the Docker site with real WordPress, WooCommerce and
#               Elementor. PHPUnit on PHP 8.1 and 8.4; browser tests,
#               screenshot comparison and Plugin/Theme Check on PHP 8.1.
# 3. package:   builds both marketplace bundles, installs one on a fresh
#               site, and keeps the zips as downloadable artifacts.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  checks:
    name: Lint, types, unit tests, PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - name: Keep the resolved composer.lock
        if: hashFiles('composer.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
      - run: npm run build
      - run: npm run lint:js
        if: ${{ !cancelled() }}
      - run: npm run lint:css
        if: ${{ !cancelled() }}
      - run: npm run lint:boundaries
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npx tsc --noEmit -p packages/ui/tsconfig.json
        if: ${{ !cancelled() }}
      - run: npm run test:unit
        if: ${{ !cancelled() }}
      - run: npm run lint:php
        if: ${{ !cancelled() }}
      - run: npm run analyse:php
        if: ${{ !cancelled() }}

  wordpress:
    name: WordPress tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.4" ]
    env:
      WP_IMAGE: wordpress:php${{ matrix.php }}-apache
      CLI_IMAGE: wordpress:cli-php${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npm run build
      - name: Start the Docker site
        run: npm run env:start
      - run: npm run test:php
      - name: Install Playwright's Chromium
        if: matrix.php == '8.1'
        run: npx playwright install --with-deps chromium
      - name: Flowbite acceptance and end-to-end tests
        if: matrix.php == '8.1'
        run: npx playwright test --project=acceptance --project=e2e
      - name: Component tests with screenshot comparison (Linux image)
        if: matrix.php == '8.1'
        run: npm run test:visual
      - name: Plugin Check and Theme Check
        if: matrix.php == '8.1'
        run: npm run check:wp
      - name: PHP log of the site
        if: failure()
        run: docker compose exec -T wordpress sh -c "cat /var/www/html/wp-content/debug.log 2>/dev/null || true"
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.php == '8.1'
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package:
    name: Marketplace packages
    needs: [ checks, wordpress ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run package
      - run: npm run test:package -- --market=rtl-theme
      - run: npm run test:package -- --market=zhaket
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-max-packages
          path: dist/*/ultra-max-*.zip
          retention-days: 30
