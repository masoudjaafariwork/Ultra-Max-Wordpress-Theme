name: Validate WordPress packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: npm ci
      - run: npm run lint
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.2'
        with:
          name: wordpress-packages
          path: dist/*.zip
          if-no-files-found: error
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run wp:start
      - run: npm run wp:activate
      - name: Verify shortcode output and escaping
        run: >-
          npm run wp -- run cli eval
          'if (!wp_is_block_theme() || !shortcode_exists("ultra_max_hello")) { exit(1); }
          $html = do_shortcode("[ultra_max_hello name=\"<script>alert(1)</script>\"]");
          if (strpos($html, "&lt;script&gt;") === false || strpos($html, "<script>") !== false) { exit(1); }'
      - run: npm run wp:stop
        if: always()
