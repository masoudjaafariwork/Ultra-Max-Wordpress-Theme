# Ultra Max development and test site.
#
# Only official images, with nothing installed at build time, so the site
# starts on networks where Debian or Packagist mirrors are unreachable.
# Start it with `npm run env:start`; see CLAUDE.md for every command.
#
# WP_IMAGE and CLI_IMAGE pick other WordPress or PHP versions, for example
# WP_IMAGE=wordpress:php8.4-apache CLI_IMAGE=wordpress:cli-php8.4.
name: ultra-max

x-mounts: &mounts
  - wordpress:/var/www/html
  - ./themes/ultra-max:/var/www/html/wp-content/themes/ultra-max
  - ./themes/ultra-max-child:/var/www/html/wp-content/themes/ultra-max-child
  - ./plugins/ultra-max-core:/var/www/html/wp-content/plugins/ultra-max-core
  - ./plugins/ultra-max-auth:/var/www/html/wp-content/plugins/ultra-max-auth
  - ./plugins/ultra-max-invoice:/var/www/html/wp-content/plugins/ultra-max-invoice
  - ./plugins/ultra-max-seo:/var/www/html/wp-content/plugins/ultra-max-seo
  - ./tools/catalog:/var/www/html/wp-content/plugins/ultra-max-catalog
  - .:/var/www/html/wp-content/ultra-max-dev

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: root
  WORDPRESS_DB_PASSWORD: password
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: wordpress
    volumes:
      - db:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 3s
      timeout: 5s
      retries: 40

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.1-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8888}:80"
    environment:
      <<: *db-env
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FS_METHOD', 'direct' );
        $$um_host = isset( $$_SERVER['HTTP_HOST'] ) ? $$_SERVER['HTTP_HOST'] : 'localhost:${WP_PORT:-8888}';
        define( 'WP_HOME', 'http://' . $$um_host );
        define( 'WP_SITEURL', 'http://' . $$um_host );
    volumes: *mounts
    healthcheck:
      test: [ "CMD", "test", "-f", "/var/www/html/wp-includes/version.php" ]
      interval: 2s
      timeout: 3s
      retries: 60

  cli:
    image: ${CLI_IMAGE:-wordpress:cli-php8.1}
    profiles: [ "tools" ]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *db-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *mounts
    working_dir: /var/www/html

volumes:
  db:
  wordpress: